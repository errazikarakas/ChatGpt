name: Bakım.TR Yardım Android repeatable runtime verification
'on':
  push:
    branches:
    - bakim-yardim-build
    paths:
    - ci/android-runtime-trigger.json
permissions:
  contents: read
  actions: read
concurrency:
  group: bakim-yardim-android-runtime
  cancel-in-progress: true
jobs:
  controller-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Download the existing disposable x86 test APK
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'build=$(python3 -c "import json; print(json.load(open(''ci/android-runtime-trigger.json''))[''runId''])")

        [[ "$build" =~ ^[0-9]{8,15}$ ]]

        gh run download "$build" --repo errazikarakas/ChatGpt --name bakim-yardim-android-x86-test-apk --dir test-apk

        test -f test-apk/app-x86_64-debug.apk'
      shell: bash
    - name: Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Android command line tools
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools
    - name: Enable KVM for the disposable emulator
      run: 'echo ''KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"'' | sudo tee /etc/udev/rules.d/99-kvm4all.rules

        sudo udevadm control --reload-rules

        sudo udevadm trigger --name-match=kvm'
    - name: Receive and decode real isolated Linux desktop frames
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 35
        arch: x86_64
        target: google_apis
        profile: pixel_6
        disable-animations: true
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        script: python3 ci/android_controller_probe.py --apk test-apk/app-x86_64-debug.apk --output android-controller-proof --timeout 180
    - name: Upload sanitized real-session verification
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: bakim-yardim-android-controller-proof
        path: android-controller-proof/*
        retention-days: 14
