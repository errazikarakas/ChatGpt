name: Bakım.TR Yardım cancel bounded obsolete lab
'on':
  push:
    branches: [bakim-yardim-build]
    paths: [.github/workflows/bakim-yardim-ci-cleanup.yml]
permissions:
  actions: write
  contents: read
jobs:
  cancel-only-superseded-publisher-lab:
    runs-on: ubuntu-22.04
    steps:
      - name: Cancel exact obsolete Windows lab after verifying project branch and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/errazikarakas/ChatGpt/actions/runs/42923404476 > old-lab.json
          python3 - <<'PY'
          import json,subprocess
          r=json.load(open('old-lab.json'))
          assert r['id']==42923404476
          assert r['head_branch']=='bakim-yardim-build'
          assert r['head_sha']=='d45c4db2edc4c454d1902dbccce2b6a1ce393154'
          assert r['path']=='.github/workflows/bakim-yardim-updater-windows.yml'
          if r['status']!='completed':
              subprocess.run(['gh','run','cancel',str(r['id']),'--repo','errazikarakas/ChatGpt'],check=True)
              print('Cancelled only the superseded disposable Windows publisher laboratory.')
          PY
