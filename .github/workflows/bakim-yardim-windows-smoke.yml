name: Bakım.TR Yardım Windows remote verification
'on':
  push:
    branches:
    - bakim-yardim-build
    paths:
    - ci/windows-remote-smoke.ps1
    - .github/workflows/bakim-yardim-windows-smoke.yml
    - ci/finalize_windows.py
  workflow_dispatch: {}
permissions:
  contents: read
  actions: read
jobs:
  remote-session:
    runs-on: windows-2022
    timeout-minutes: 70
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Download original compiled portable client
      env:
        GH_TOKEN: ${{ github.token }}
      run: "New-Item -ItemType Directory -Force app | Out-Null\nfor ($i=0; $i -lt 200; $i++) {\n $ids=gh api 'repos/errazikarakas/ChatGpt/actions/workflows/bakim-yardim.yml/runs?branch=bakim-yardim-build&per_page=30'\
        \ --jq '.workflow_runs[] | select((.head_commit.message // \"\") | startswith(\"[windows-only]\")) | .id'\n $build=[string]($ids | Select-Object -First 1)\n if ($build) {\n  gh run download $build\
        \ --repo errazikarakas/ChatGpt --name Bakim-TR-Yardim-Windows --dir app\n  if ($LASTEXITCODE -eq 0 -and (Test-Path app/Bakim-TR-Yardim.exe)) { \"ORIGINAL_BUILD_RUN=$build\" >> $env:GITHUB_ENV; break\
        \ }\n  $state=gh run view $build --repo errazikarakas/ChatGpt --json status,conclusion | ConvertFrom-Json\n  if($state.status -eq 'completed' -and $state.conclusion -ne 'success'){throw 'Newest\
        \ Windows source build did not produce a validated executable'}\n }\n Start-Sleep 15\n}\nif (-not(Test-Path app/Bakim-TR-Yardim.exe)) { throw 'Compiled Windows client is unavailable' }"
    - name: Finalize branded asset and isolated portable cache
      run: 'python -m pip install pillow brotli

        python ci/finalize_windows.py --input app/Bakim-TR-Yardim.exe --output release/Bakim-TR-Yardim.exe --config branding/client-public.json --build-run $env:ORIGINAL_BUILD_RUN

        Copy-Item app/NOTICE.txt release/NOTICE.txt

        Copy-Item app/AGPL-3.0.txt release/AGPL-3.0.txt

        Copy-Item branding/client-public.json release/client-public.json'
    - name: Smoke-test final distributable
      run: 'New-Item -ItemType Directory -Force final-smoke-work | Out-Null

        Copy-Item ci/network_probe.py final-smoke-work/network_probe.py

        powershell -ExecutionPolicy Bypass -File ci/windows-smoke.ps1 -Executable release/Bakim-TR-Yardim.exe -OutputDirectory release/proof

        $inner=Join-Path $env:LOCALAPPDATA "bakim-tr-yardim/Bakim-TR-Yardim.exe"

        $icon=Join-Path $env:LOCALAPPDATA "bakim-tr-yardim/data/flutter_assets/assets/icon.png"

        if(-not(Test-Path $inner)-or -not(Test-Path $icon)){throw "Isolated cache or branded icon absent"}

        $proof=Get-Content release/finalization.json -Raw | ConvertFrom-Json

        if((Get-FileHash $icon -Algorithm SHA256).Hash.ToLowerInvariant() -ne $proof.iconSha256){throw "Extracted icon hash mismatch"}'
    - name: Upload final Windows distributable
      uses: actions/upload-artifact@v4
      with:
        name: Bakim-TR-Yardim-Windows-Final
        path: release/*
        retention-days: 30
    - name: Connect to isolated real Linux desktop
      run: powershell -ExecutionPolicy Bypass -File ci/windows-remote-smoke.ps1 -Executable release/Bakim-TR-Yardim.exe -OutputDirectory remote-proof
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: bakim-yardim-windows-remote-e2e
        path: remote-proof/*
        retention-days: 14
concurrency:
  group: bakim-yardim-windows-verification
  cancel-in-progress: true
